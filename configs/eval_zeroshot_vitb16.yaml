# Phase 0: zero-shot accuracy of the untouched model on FULL test sets,
# compared to the published OpenCLIP table (which also uses full test sets).
experiment: eval_zeroshot_vitb16
phase: 0
seed: 0
device: auto            # auto picks cuda if available
amp: true               # fp16 autocast on GPU only

model:
  # Liao et al. App. A: "OpenAI checkpoints with QuickGELU". The -quickgelu config is required;
  # plain ViT-B-16 builds GELU and only warns about the mismatch.
  name: ViT-B-16-quickgelu
  pretrained: openai
checkpoint: null        # path to a fine-tuned checkpoint (.pt with only trained tensors), or null

data:
  root: data            # on Colab, point this at local disk (/content/data), not Drive, for speed
  eval_sets: [flowers, eurosat, cifar10, cifar100, dtd, food101]
  batch_size: 256
  num_workers: 2
  max_samples: null     # set e.g. 256 for a quick smoke run
  split_seed: 0         # Liao et al. App. A: EuroSAT "seed-0 random permutation ... 80/20"
  split_mode: permutation
  eurosat_test_fraction: 0.2

reference:
  url: https://raw.githubusercontent.com/mlfoundations/open_clip/main/docs/openclip_results.csv
  tolerance_pp: 1.0     # "roughly matches" threshold in accuracy points; our choice, adjust if you like

output:
  results_dir: results/phase0
